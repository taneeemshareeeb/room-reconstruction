[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-reconstruction"
version = "0.1.0"
description = "Tools for room reconstruction workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "opencv-python-headless>=4.10,<5",
    "pillow-heif>=0.16",
    "av>=12,<16",
]

[tool.setuptools.packages.find]
where = ["src"]
