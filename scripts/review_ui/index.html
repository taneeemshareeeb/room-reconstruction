<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Room scan review</title>
  <style>
    :root { color-scheme: light; --ink:#17231f; --muted:#65736d; --line:#dce5df; --paper:#f5f7f4; --green:#176b50; --orange:#bd6c24; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    header { display:flex; justify-content:space-between; gap:20px; align-items:center; padding:21px clamp(18px,4vw,54px); background:#fff; border-bottom:1px solid var(--line) }
    h1 { margin:0; font-size:22px; letter-spacing:-.03em } .sub { color:var(--muted); font-size:13px; margin-top:3px }
    button,select { font:inherit } button { border:1px solid var(--line); border-radius:9px; padding:9px 13px; background:white; color:var(--ink); cursor:pointer } button:hover { border-color:#9db5a8 } button.primary { background:var(--green); color:white; border-color:var(--green) }
    main { padding:24px clamp(18px,4vw,54px) 54px; max-width:1600px; margin:auto }
    .notice { display:none; padding:12px 15px; background:#fff4e7; border:1px solid #f0d0a7; border-radius:10px; margin-bottom:16px }
    .processor { margin:0 0 18px; padding:15px; border:1px solid var(--line); border-radius:12px; background:#fff; display:grid; grid-template-columns:2fr 1fr repeat(3,minmax(110px,.7fr)) auto; gap:10px; align-items:end }
    [hidden] { display:none !important }
    .processor label { display:grid; gap:4px; color:var(--muted); font-size:12px }
    .processor input,.processor select { width:100%; min-width:0; padding:9px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:white; font:inherit }
    .job-status { grid-column:1/-1; color:var(--muted); font-size:13px; min-height:1em }
    .stats { display:grid; grid-template-columns:repeat(5,minmax(100px,1fr)); gap:12px; margin:0 0 18px }
    .stat { padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:white } .stat strong { display:block; font-size:22px; letter-spacing:-.04em } .stat span { color:var(--muted); font-size:12px }
    .layout { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(310px,.9fr); gap:17px; align-items:start }
    .panel { border:1px solid var(--line); background:white; border-radius:14px; overflow:hidden }
    .tabs { display:flex; gap:5px; flex-wrap:wrap; padding:12px; border-bottom:1px solid var(--line) }
    .tab { border:0; background:transparent; color:var(--muted); padding:8px 12px } .tab.active { color:#fff; background:var(--green) }
    .image-wrap { min-height:320px; display:grid; place-items:center; padding:13px; background:#fafbfa }
    .image-wrap img { display:block; width:100%; height:auto; max-height:72vh; object-fit:contain }
    .empty { padding:55px 20px; text-align:center; color:var(--muted) }
    .caption { padding:10px 15px; color:var(--muted); font-size:12px; border-top:1px solid var(--line) }
    .side-head { padding:16px 17px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line) }
    .side-head h2 { font-size:16px; margin:0 } .side-head span { color:var(--muted); font-size:12px }
    .candidate-list { padding:10px; max-height:70vh; overflow:auto }
    .candidate { border:1px solid var(--line); padding:13px; border-radius:11px; margin-bottom:9px }
    .candidate-top { display:flex; justify-content:space-between; align-items:start; gap:10px } .candidate h3 { font-size:14px; margin:0 } .candidate p { color:var(--muted); font-size:12px; margin:7px 0 10px }
    .badge { white-space:nowrap; background:#eff5f0; color:#326149; border-radius:20px; padding:3px 8px; font-size:11px }
    .review { display:flex; gap:6px; flex-wrap:wrap } .review button { padding:5px 8px; font-size:11px; border-radius:7px } .review button.selected { background:#e4f1e9; border-color:#83b49a; color:#145b3e }
    .foot { color:var(--muted); margin-top:18px; font-size:12px }
    @media(max-width:900px) { .layout { grid-template-columns:1fr } .candidate-list { max-height:420px } }
    @media(max-width:600px) { header { align-items:flex-start; flex-direction:column } .stats { grid-template-columns:repeat(2,1fr) } .image-wrap { min-height:230px } }
    @media(max-width:1000px) { .processor { grid-template-columns:repeat(2,minmax(0,1fr)) } .processor .capture-input { grid-column:1/-1 } }
  </style>
</head>
<body>
  <header>
    <div><h1>Room scan review</h1><div class="sub" id="capture-label">Loading scan results…</div></div>
    <button class="primary" id="export">Export review JSON</button>
  </header>
  <main>
    <form class="processor" id="processor" hidden>
      <label class="capture-input">Capture path under data/raw<input name="capture" required placeholder="data/raw/single_scan_with_ceiling.zip"></label>
      <label>Input tier<select name="tier"><option value="lidar">LiDAR</option><option value="video">Video</option><option value="photos">Photos</option></select></label>
      <label>Frame step (LiDAR)<input name="frame_step" type="number" min="1" value="10"></label>
      <label>Voxel metres (LiDAR)<input name="voxel_size_m" type="number" min="0.001" step="0.005" value="0.02"></label>
      <label>Video sample seconds<input name="sample_seconds" type="number" min="0.1" step="0.5" value="1"></label>
      <button class="primary" type="submit">Process capture</button>
      <div class="job-status" id="job-status" role="status"></div>
    </form>
    <div class="notice" id="notice"></div>
    <section class="stats" id="stats"></section>
    <div class="layout">
      <section class="panel">
        <nav class="tabs" id="tabs" aria-label="Preview type"></nav>
        <div class="image-wrap" id="image-wrap"></div>
        <div class="caption" id="caption"></div>
      </section>
      <section class="panel">
        <div class="side-head"><h2 id="list-title">Candidates</h2><span id="list-count"></span></div>
        <div class="candidate-list" id="candidate-list"></div>
      </section>
    </div>
    <p class="foot">Geometry candidates are unverified. Review marks stay in this browser until you export them. Processing reads the selected project input and writes results to the configured runs folder.</p>
  </main>
  <script>
    const APP_MODE = __APP_MODE__;
    const views = [
      {key:"overview", label:"Point cloud", image:"plan.png", note:"Projected point cloud preview. This is not a floor plan."},
      {key:"rooms", label:"Raster rooms", image:"room_candidates.png", note:"Dashed orange outlines are enclosed-region candidates; solid green outlines are supported wall loops. Both need review."},
      {key:"metrics", label:"Room metrics", image:"room_candidates.png", note:"Rough spans and pass-specific surface samples inside each raster room region. Values are candidates, not verified room measurements."},
      {key:"checks", label:"Measured checks", image:"room_candidates.png", note:"Numerical matches against the hand measurements. The scan and sketch are not spatially registered, so a close match does not confirm identity."},
      {key:"wall_rooms", label:"Wall outlines", image:"room_candidates.png", note:"Solid green outlines join four cross-height wall segments when each side has at least 70% direct scan support. These remain unverified hypotheses."},
      {key:"walls", label:"Walls", image:"wall_candidates.png", note:"Wall traces are candidates; support counts indicate cross-height consistency, not accuracy."},
      {key:"gaps", label:"Door / gaps", image:"room_candidates.png", note:"Aligned wall interruptions are possible openings or missing scan evidence; they are not classified as doors."},
      {key:"consensus", label:"Shared traces", image:"cross_height_wall_candidates.png", note:"Segments that line up across height bands. Agreement is not ground truth."},
      {key:"overlap", label:"Image overlap", image:"plan.png", note:"Adjacent-image homography matches and registration status. Mosaic drift is possible; metric 3D geometry is unavailable."}
    ];
    let data = null, active = "overview";
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const itemsFor = key => {
      if (key === "rooms") return data.files.rooms || [];
      if (key === "overlap") {
        const analysis=data.files.image_analysis || {};
        return (analysis.adjacent_pair_matches || []).map(match=>({
          id:`image pair ${match.from_image_index + 1} → ${match.to_image_index + 1}`,
          status:match.status,
          match,
        }));
      }
      if (key === "metrics") return ((data.files.plan || {}).room_candidates) || [];
      if (key === "checks") {
        const comparison=((data.files.plan || {}).ground_truth_comparison) || {};
        const records=[];
        for (const match of comparison.closest_candidate_for_each_measured_side || []) records.push({id:`${match.measurement} · ${match.closest_room_candidate_id}`,kind:"side",data:match});
        for (const match of comparison.closest_nearby_wall_for_each_side || []) records.push({id:`${match.measurement} wall trace · ${match.wall_candidate_id}`,kind:"wall_length",data:match});
        for (const candidate of comparison.distinct_side_wall_checks_by_room_candidate || []) records.push({id:`distinct wall check · ${candidate.room_candidate_id}`,kind:"distinct_walls",data:candidate});
        for (const match of comparison.room_candidate_ranking_by_widths || []) records.push({id:`width check · ${match.room_candidate_id}`,kind:"width",data:match});
        for (const match of comparison.nearest_wall_gap_by_room_candidate || []) records.push({id:`nearest gap · ${match.room_candidate_id}`,kind:"gap_distance",data:match});
        if (comparison.bottom_wall_segment) records.push({id:"bottom wall before doorway",kind:"partial_wall",data:comparison.bottom_wall_segment});
        if (comparison.doorway_comparison) records.push({id:"doorway width",kind:"doorway",data:comparison.doorway_comparison});
        const ceiling=comparison.ceiling_height_comparison || {};
        if (ceiling.closest_room_candidate_peak) records.push({id:`ceiling · ${ceiling.closest_room_candidate_peak.room_candidate_id}`,kind:"ceiling",data:ceiling.closest_room_candidate_peak});
        return records;
      }
      if (key === "wall_rooms") return data.files.wall_rooms || [];
      if (key === "walls") return data.files.walls || [];
      if (key === "gaps") return data.files.wall_gaps || [];
      if (key === "consensus") return ((data.files.consensus || {}).cross_band_consensus_candidates || []);
      return [];
    };
    const storageKey = () => "room-scan-review:" + ((data.files.plan || {}).capture || {}).id;
    const marks = () => { try { return JSON.parse(localStorage.getItem(storageKey()) || "{}"); } catch { return {}; } };
    function renderStats() {
      const plan = data.files.plan || {}, processing = plan.processing || {};
      const pointCount = processing.point_count == null ? "—" : Number(processing.point_count).toLocaleString();
      const tier=((plan.capture || {}).tier) || "lidar", analysis=data.files.image_analysis || {};
      const entries = tier === "photos" || tier === "video"
        ? [["Tier", tier], ["Images / frames", analysis.image_count || 0], ["Pair registrations", analysis.registered_adjacent_pairs || 0], ["Preview", analysis.preview_kind || "unavailable"], ["Metric geometry", "Unavailable"]]
        : [["Points", pointCount], ["Raster rooms", (data.files.rooms || []).length], ["Wall outlines", (data.files.wall_rooms || []).length], ["Wall candidates", (data.files.walls || []).length], ["Wall gaps", (data.files.wall_gaps || []).length], ["Shared wall traces", ((data.files.consensus || {}).cross_band_consensus_candidates || []).length]];
      document.querySelector("#stats").innerHTML = entries.map(([label,value]) => `<div class="stat"><strong>${esc(value)}</strong><span>${label}</span></div>`).join("");
      const tier=((plan.capture || {}).tier) || "lidar";
      document.querySelector("#capture-label").textContent = tier === "lidar"
        ? `${((plan.capture || {}).id) || "Scan results"} · LiDAR · every ${processing.frame_step || "?"} frame · ${processing.voxel_size_m ?? "?"} m voxels`
        : `${((plan.capture || {}).id) || "Image results"} · ${tier} · metric geometry unavailable`;
    }
    function renderTabs() {
      const tier=((data.files.plan || {}).capture || {}).tier;
      const visible=views.filter(view=>tier === "photos" || tier === "video" ? ["overview","overlap"].includes(view.key) : view.key !== "overlap");
      document.querySelector("#tabs").innerHTML = visible.map(view => {
        const label=view.key === "overview" && tier !== "lidar" ? (tier === "video" ? "Video preview" : "Photo preview") : view.label;
        return `<button class="tab ${active===view.key?"active":""}" data-view="${view.key}">${label}</button>`;
      }).join("");
      document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => { active=button.dataset.view; render(); }));
    }
    function renderImage() {
      const view = views.find(item => item.key === active), wrap=document.querySelector("#image-wrap");
      const tier=((data.files.plan || {}).capture || {}).tier, analysis=data.files.image_analysis || {};
      const note=view.key === "overview" && (tier === "photos" || tier === "video")
        ? (analysis.preview_kind === "contact_sheet"
          ? "Contact sheet shown because adjacent image matches did not support a stable global mosaic. This is image coverage review, not a floor plan."
          : "Image-space panorama candidate assembled from adjacent feature matches. Accumulated drift is possible; this is not a metric floor plan.")
        : view.note;
      document.querySelector("#caption").textContent = note;
      if (!data.images.includes(view.image)) { wrap.innerHTML=`<div class="empty">${esc(view.image)} is missing.<br>Generate a result folder with <code>run.py</code> first.</div>`; return; }
      wrap.innerHTML=`<img src="/artifact/${view.image}" alt="${esc(view.label)} preview">`;
    }
    function describe(item, key) {
      if (key === "overlap") { const m=item.match || {}; return `${m.status} · ${m.good_matches || 0} feature matches · ${m.ransac_inliers || 0} geometric inliers (${Math.round(100*(m.inlier_fraction || 0))}%)`; }
      if (key === "rooms") return `${Number(item.estimated_area_m2 || 0).toFixed(2)} m² estimated · center ${item.center_xz_m?.map(v=>Number(v).toFixed(2)).join(", ")} m`;
      if (key === "metrics") {
        const geometry=item.geometry_candidate || {}, floor=item.floor_surface_candidate || {}, upper=item.upper_surface_candidates || {};
        const spans=(geometry.dominant_axis_spans_m || []).map(v=>Number(v).toFixed(2)).join(" × ");
        const peaks=(upper.height_candidates || []).map(v=>`${Number(v.height_above_local_floor_m).toFixed(2)} m (${v.supporting_points} pts)`).join(", ") || "no supported upper peak";
        const floorText=floor.elevation_world_y_m == null ? "floor insufficient" : `floor y ${Number(floor.elevation_world_y_m).toFixed(2)} m (${floor.supporting_points} pts)`;
        const walls=(item.nearby_wall_evidence || []).map(v=>`${v.wall_candidate_id} ${Number(v.length_m).toFixed(2)} m`).join(", ") || "no nearby wall traces";
        const gaps=(item.nearby_wall_gap_evidence || []).map(v=>`${v.wall_gap_candidate_id} ${Number(v.observed_width_m).toFixed(2)} m`).join(", ") || "no nearby wall gaps";
        return `${Number(geometry.polygon_area_m2 || item.estimated_area_m2 || 0).toFixed(2)} m² rough · spans ${spans || "—"} m · ${floorText} · upper: ${peaks} · walls: ${walls} · gaps: ${gaps}`;
      }
      if (key === "checks") {
        const v=item.data || {};
        if (item.kind === "side") return `${Number(v.measured_m).toFixed(2)} m measured · rough span ${Number(v.closest_rough_span_m).toFixed(2)} m · difference ${Number(v.absolute_difference_m).toFixed(2)} m`;
        if (item.kind === "wall_length") return `${Number(v.measured_m).toFixed(2)} m measured · scan trace ${Number(v.candidate_wall_length_m).toFixed(2)} m · difference ${Number(v.absolute_difference_m).toFixed(2)} m · ${v.room_candidate_id}, ${v.boundary_distance_m} m from outline · ${(v.supporting_height_bands || []).join(", ")}`;
        if (item.kind === "distinct_walls") return `${v.distinct_side_wall_match_count}/${v.side_measurement_count} side lengths have separate nearby wall traces · ${v.matches.map(m=>`${m.measurement}: ${m.wall_candidate_id ? `${Number(m.candidate_wall_length_m).toFixed(2)} m (${Number(m.absolute_difference_m).toFixed(2)} m difference)` : "no distinct trace"}`).join(" · ")} · length assignment only, room sides are not spatially registered`;
        if (item.kind === "width") return `rough spans ${v.rough_spans_m?.map(n=>Number(n).toFixed(2)).join(" × ")} m · width difference ${Number(v.mean_absolute_width_difference_m).toFixed(2)} m`;
        if (item.kind === "partial_wall") return `${Number(v.measured_m).toFixed(2)} m measured · partial wall, not mapped to scan yet`;
        if (item.kind === "gap_distance") return `gap ${Number(v.observed_width_m).toFixed(2)} m · ${Number(v.distance_to_region_boundary_m).toFixed(2)} m from this region boundary`;
        if (item.kind === "doorway") return v.candidate_width_m == null ? `${Number(v.measured_width_m).toFixed(2)} m measured · no comparable wall gap` : `${Number(v.measured_width_m).toFixed(2)} m measured · gap ${Number(v.candidate_width_m).toFixed(2)} m · difference ${Number(v.absolute_difference_m).toFixed(3)} m`;
        return `${Number(v.candidate_height_m).toFixed(2)} m closest height peak · difference ${Number(v.absolute_difference_m).toFixed(2)} m · ${v.room_candidate_id}`;
      }
      if (key === "wall_rooms") return `${Number(item.estimated_area_m2 || 0).toFixed(2)} m² · sides ${item.side_lengths_m?.map(v=>Number(v).toFixed(2)).join(" × ")} m · corners ${item.corner_angles_deg?.map(v=>Number(v).toFixed(0)).join("°, ")}° · min wall support ${(100*Number(item.minimum_side_support_fraction || 0)).toFixed(0)}%`;
      if (key === "walls") return `${Number(item.length_m || 0).toFixed(2)} m · ${item.height_band_support_count ?? 1}/3 height bands · ${item.supporting_cells ?? 0} supporting cells`;
      if (key === "gaps") return `${Number(item.observed_gap_m || 0).toFixed(2)} m gap · ${item.height_band_support_count ?? 1}/3 height bands · ${(item.supporting_height_bands || []).join(", ") || "band support unavailable"}`;
      return `${Number(item.shared_length_m || 0).toFixed(2)} m shared · ${item.support_count || 0}/3 height bands (${(item.supporting_bands || []).join(", ")})`;
    }
    function renderCandidates() {
      const list=itemsFor(active), listEl=document.querySelector("#candidate-list"), currentMarks=marks();
      document.querySelector("#list-title").textContent = active === "overview" ? "How to read this" : ({rooms:"Raster room candidates",metrics:"Per-room measurements",checks:"Measured comparisons",wall_rooms:"Wall supported outlines",walls:"Wall candidates",gaps:"Possible wall gaps",consensus:"Shared wall traces",overlap:"Adjacent image overlap"}[active]);
      document.querySelector("#list-count").textContent = active === "overview" ? "" : `${list.length} total`;
      if (active === "overview") { listEl.innerHTML='<div class="empty">Choose a preview tab to inspect candidate details. Use the buttons on each candidate to record your visual review, then export the marks as JSON.</div>'; return; }
      if (!list.length) { listEl.innerHTML='<div class="empty">No candidates in this result.</div>'; return; }
      listEl.innerHTML=list.map(item => {
        const status=currentMarks[item.id] || "unreviewed";
        return `<article class="candidate"><div class="candidate-top"><h3>${esc(item.id)}</h3><span class="badge">${esc(item.status || "candidate_unverified")}</span></div><p>${esc(describe(item,active))}</p><div class="review">${[["plausible","Looks plausible"],["false_positive","Likely false"],["needs_followup","Check later"]].map(([value,label])=>`<button data-id="${esc(item.id)}" data-mark="${value}" class="${status===value?"selected":""}">${label}</button>`).join("")}</div></article>`;
      }).join("");
      listEl.querySelectorAll("[data-mark]").forEach(button => button.addEventListener("click", () => {
        const next=marks(); next[button.dataset.id] = next[button.dataset.id] === button.dataset.mark ? "unreviewed" : button.dataset.mark;
        localStorage.setItem(storageKey(),JSON.stringify(next)); renderCandidates();
      }));
    }
    function render() { renderTabs(); renderImage(); renderCandidates(); }
    document.querySelector("#export").addEventListener("click", () => {
      const output={capture:((data.files.plan || {}).capture || {}).id || null, exported_at:new Date().toISOString(), marks:marks()};
      const link=document.createElement("a"), blob=new Blob([JSON.stringify(output,null,2)+"\n"],{type:"application/json"});
      link.href=URL.createObjectURL(blob); link.download="scan_review.json"; link.click(); URL.revokeObjectURL(link.href);
    });
    async function loadResults() {
      const response=await fetch("/api/results",{cache:"no-store"}); if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const result=await response.json();
      data=result; renderStats(); render();
      if (result.errors.length) { const notice=document.querySelector("#notice"); notice.style.display="block"; notice.textContent=result.errors.join(" · "); }
    }
    loadResults().catch(error => { document.querySelector("#capture-label").textContent="Could not load results"; document.querySelector("#image-wrap").innerHTML=`<div class="empty">${esc(error.message)}. Check that the server is pointed at a generated result folder.</div>`; });
    if (APP_MODE) {
      const form=document.querySelector("#processor"), status=document.querySelector("#job-status");
      form.hidden=false;
      form.addEventListener("submit",async event=>{
        event.preventDefault();
        const fields=Object.fromEntries(new FormData(form).entries());
        status.textContent="Starting capture processing…";
        try {
          const response=await fetch("/api/process",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(fields)});
          const result=await response.json(); if(!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          while(true) {
            await new Promise(resolve=>setTimeout(resolve,1000));
            const job=await (await fetch("/api/job",{cache:"no-store"})).json();
            if(job.status === "running") { status.textContent=`Processing ${job.capture} (${job.tier})…`; continue; }
            if(job.status === "complete") { status.textContent=job.stdout || "Processing complete."; active="overview"; await loadResults(); break; }
            if(job.status === "failed") throw new Error(job.stderr || "Processing failed.");
          }
        } catch(error) { status.textContent=`Processing failed: ${error.message}`; }
      });
    }
  </script>
</body>
</html>
